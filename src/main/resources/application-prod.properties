# ---------------------------------------------------------------------------
# Production profile
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DATABASE_URL}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

server.port=${PORT:8080}

# Secrets must always be provided through environment variables in production.
authorization.jwt.secret=${JWT_SECRET}

logging.level.pe.com.agridron=INFO
