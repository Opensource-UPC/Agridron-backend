# ---------------------------------------------------------------------------
# AgriDron Backend - shared configuration
# ---------------------------------------------------------------------------
spring.application.name=agridron-backend

# Default to the development profile when no explicit profile is provided.
spring.profiles.default=dev

# ---------------------------------------------------------------------------
# DataSource / JPA
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=60000

# Schema is owned by Flyway. Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=pe.com.agridron.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCasePhysicalNamingStrategy

# ---------------------------------------------------------------------------
# Flyway migrations
# Blocks are reserved per bounded context (see docs/backend-conventions.md):
#   V1-V99     shared          V100-V199  iam
#   V200-V299  field           V300-V399  flight operations
#   V400-V499  weather         V500-V599  analytics
#   V600-V699  inventory
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# Application information for OpenAPI documentation
# ---------------------------------------------------------------------------
documentation.application.title=AgriDron API
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# ---------------------------------------------------------------------------
# i18n message bundles
# ---------------------------------------------------------------------------
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ---------------------------------------------------------------------------
# Concurrency (Project Loom)
# ---------------------------------------------------------------------------
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
cors.max-age=3600

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
info.app.name=${spring.application.name}
info.app.version=@project.version@

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------------
# JWT (consumed by the IAM bounded context)
# ---------------------------------------------------------------------------
authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}
